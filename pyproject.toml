[build-system]
# In-tree, stdlib-only backend: installs need no downloads.
#   pip install --no-index --no-build-isolation [-e] <this dir>
requires = []
build-backend = "sf_backend"
backend-path = ["_build"]

[project]
name = "stateframe"
version = "0.2.8"
description = "StateFrame: an Open Agent Engine that sends a typed state frame instead of chat history. Preview release."
readme = "README.md"
license = "AGPL-3.0-only"  # dual: AGPLv3 or a commercial license (COMMERCIAL-LICENSE.md)
license-files = ["LICENSE", "NOTICE", "COMMERCIAL-LICENSE.md"]
requires-python = ">=3.11"
# Declared, not vendored. Exact pins with PyPI hashes live in requirements.txt (install.sh uses
# `pip install --require-hashes -r requirements.txt`); these are the same top-level versions.
dependencies = [
    "pytest==9.0.2",         # MIT: runs the repository's checks
    "PyYAML==6.0.3",         # MIT
    "jsonschema==4.26.0",    # MIT: schema validation
    "jedi==0.20.0",          # MIT: repo intel
    "parso==0.8.7",          # MIT
    "networkx==3.6.1",       # BSD-3-Clause: repo intel graph
]
# Unknown classifier on purpose: package indexes reject it, a guard against accidental upload.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# Syntax-aware repo map, installed by default (install.sh; --no-repomap skips it): tree-sitter plus one official
# MIT grammar package per language, served through stateframe.ts_grammars. No grammar bundle, no downloads.
repomap = [  # all MIT
    "tree-sitter==0.25.2", "tree-sitter-python==0.25.0", "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2", "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5", "tree-sitter-ruby==0.23.1", "tree-sitter-php==0.25.1", "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4", "tree-sitter-c-sharp==0.23.5", "tree-sitter-html==0.23.2",
    "tree-sitter-css==0.25.0", "tree-sitter-json==0.24.8", "tree-sitter-toml==0.7.0", "tree-sitter-yaml==0.7.2",
]

[project.scripts]
stateframe = "stateframe.cli:main"
