# StateFrame per-role model routes. Uncomment only the roles and fields you need.
# Values not set here inherit the run's default endpoint, model, and profile.

# read: Navigate, read, search, and run checks.
# [roles.read]
# endpoint = "http://127.0.0.1:8080/v1"
# model = "model-name"
# api_key_env = "MODEL_API_KEY"
# slot = "auto"
# temperature = 1.0
# top_p = 1.0
# top_k = 40
# min_p = 0.0
# max_tokens = 24000
# timeout_s = 1800
# context_tokens = 65536
# tokenizer = "http://127.0.0.1:8080/v1"
# allow_remote = false
# cost_input_per_mtok = 0.0
# cost_cached_input_per_mtok = 0.0
# cost_output_per_mtok = 0.0

